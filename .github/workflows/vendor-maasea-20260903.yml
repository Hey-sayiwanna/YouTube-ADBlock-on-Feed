name: Vendor Maasea YouTube Enhance 2026-09-03 snapshot

on:
  push:
    paths:
      - '.github/workflows/vendor-maasea-20260903.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned upstream snapshot
        shell: bash
        run: |
          set -euo pipefail
          SHA=65075cdb388fc5e3094afd7e7314c67b243f3525
          mkdir -p Upstream/Maasea/Script/Youtube
          curl -fsSL "https://raw.githubusercontent.com/Maasea/sgmodule/${SHA}/YouTube.Enhance.sgmodule" -o Upstream/Maasea/YouTube.Enhance.sgmodule
          curl -fsSL "https://raw.githubusercontent.com/Maasea/sgmodule/${SHA}/Script/Youtube/youtube.response.js" -o Upstream/Maasea/Script/Youtube/youtube.response.js
          curl -fsSL "https://raw.githubusercontent.com/Maasea/sgmodule/${SHA}/Script/Youtube/youtube.request.js" -o Upstream/Maasea/Script/Youtube/youtube.request.js
          curl -fsSL "https://raw.githubusercontent.com/Maasea/sgmodule/${SHA}/LICENSE" -o Upstream/Maasea/LICENSE
          printf '%s\n' "$SHA" > Upstream/Maasea/UPSTREAM_COMMIT.txt
      - name: Commit vendored snapshot
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- Upstream/Maasea)" ]; then
            echo 'Snapshot already vendored.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Upstream/Maasea
          git commit -m 'Vendor Maasea YouTube Enhance snapshot (2026-07-19, pre-2026-09-03)'
          git push
